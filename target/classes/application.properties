spring.application.name=mybuss-backend

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger

# Lee variables de un archivo .env en la raiz del proyecto si existe (no se sube a git)
spring.config.import=optional:file:.env[.properties]

# Base de datos: por defecto un Postgres local en localhost:5432 (cada uno levanta el suyo con Docker).
# Para usar la base en la nube, definir DB_URL, DB_USERNAME y DB_PASSWORD como variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mybuss}
spring.datasource.username=${DB_USERNAME:alumno}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
